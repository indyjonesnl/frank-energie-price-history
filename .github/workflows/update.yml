name: update-and-deploy

on:
  schedule:
    # ~6 daily attempts spanning the window when Frank's day-ahead prices land.
    # GitHub cron drifts up to ~2h, so we don't gate on local clock; we rely on
    # the fetch step being idempotent (no data change → no rebuild → quick exit).
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch
        id: fetch
        run: |
          set +e
          pnpm fetch
          CODE=$?
          set -e
          echo "exit=$CODE" >> $GITHUB_OUTPUT
          if [[ $CODE -ne 0 && $CODE -ne 10 ]]; then exit $CODE; fi

      - name: Decide if rebuild needed
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ steps.fetch.outputs.exit }}" == "0" ]]; then
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "Data unchanged on scheduled run; skipping rebuild."
          else
            echo "rebuild=true" >> $GITHUB_OUTPUT
          fi

      - name: Aggregate
        if: steps.decide.outputs.rebuild == 'true'
        run: pnpm aggregate

      - name: Generate indexes
        if: steps.decide.outputs.rebuild == 'true'
        run: pnpm exec tsx scripts/index.ts

      - name: Commit data + aggregates
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/api/v1/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update [skip ci]"
            git push
          fi

      - name: Build
        if: steps.decide.outputs.rebuild == 'true'
        run: pnpm build

      - name: Upload Pages artifact
        if: steps.decide.outputs.rebuild == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
